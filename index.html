<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四个生成器 · 本轮修改</title><style>body{margin:auto;max-width:1250px;padding:24px;font:16px/1.65 system-ui;background:#f3f5f8;color:#142238}a{color:#1556af}article{background:white;border:1px solid #d6dde8;border-radius:12px;padding:20px;margin:22px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}video{width:100%;aspect-ratio:1;background:#505764}button{padding:10px 16px;margin:4px;border:0;border-radius:7px;background:#205fb8;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f8;padding:12px;font-size:12px}code{overflow-wrap:anywhere}nav{position:sticky;top:0;background:white;padding:10px;z-index:5}.note{padding:12px;background:#fff2c9;border-radius:8px}.ok{background:#e1f1e8;padding:12px}h1{font-size:28px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><body><h1>四个生成器 · 本轮修改预览</h1><p>按本轮反馈修改第 1、3、4 项；第 2 项保留。每个修改项都有两组案例及正常、反事实、黑白遮罩和红色叠加视频。</p><p class="note">等待你审查；尚未向 Sara 提交。新版材料不沿用旧版自检结果。</p><article><h2><a href="copper_sheet_false_static_magnetic_shielding/d4acd934570bbb9981a35d5e993e04f54c9b8257/index.html">磁铁与铜板</a></h2><p>放大钢球偏转，露出红蓝 N/S 两极；增加固定竖直刻线，重排支架与铜板导轨。</p></article><article><h2>气流与双板</h2><p>新版视频已渲染，正在回传并完成网页检查。</p></article><article><h2>摇摆舟同步对照</h2><p>新版视频已渲染，正在回传并完成网页检查。</p></article><article><h2><a href="electrostatic_shuttle_contact_charge_transfer_failure/d341d752737e689d88f3928129ef2ea4249265ef/index.html">静电摆球 · 沿用原版</a></h2><p>按你的反馈保留，本轮未修改。</p></article><pre id="receipt" hidden></pre><script>const vs=[...document.querySelectorAll('video')],events=[];
function show(){document.getElementById('receipt').textContent=JSON.stringify({videos:vs.map(v=>({id:v.id,url:v.currentSrc,time:v.currentTime,duration:v.duration,width:v.videoWidth,height:v.videoHeight,ended:v.ended,readyState:v.readyState,error:v.error?{code:v.error.code,message:v.error.message}:null})),events},null,2)}
async function playAll(){for(let v of vs){v.currentTime=0;v.muted=true}await Promise.all(vs.map(v=>v.play()));show()}
function seekFrame(i){for(let v of vs){v.pause();v.currentTime=i/24}show()}
function seekEvidence(){for(let v of vs){v.pause();v.currentTime=Number(v.dataset.evidence)/24}show()}
for(let v of vs)for(let e of ['ended','seeked','error'])v.addEventListener(e,()=>{events.push({id:v.id,event:e,time:v.currentTime});show()});setInterval(show,500);</script></body></html>
